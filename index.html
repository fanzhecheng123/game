<!DOCTYPE html><HTML lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>贪吃蛇</title><style>*{margin:0;padding:0;box-sizing:border-box}主体{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#fff;touch-action:none}h1{margin-bottom:10px;font-size:24px}canvas{border:2px solid #e94560;border-radius:8px;background:#16213e;max-width:90vw;max-height:50vh}.controls{display:grid;grid-template-areas:". up ." "left . right" ". down .";gap:8px;margin-top:16px}.controls button{宽度:60px;高度:60px;font-size:24px;border:none;border-radius:12px;background:#0f3460;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}.controls button:active{background:#e94560}.向上{grid-area:向上}.down{grid-area:down}.left{grid-area:left}.right{grid-area:right}p{margin-top:10px;color:#aaa;font-size:14px}</style></head><主体><h1>🐍 贪吃蛇</h1><canvas id="game" width="400" height="400"></canvas><div class="controls"><button class="up" onclick="设置方向(0,-1)">▲</button><button class=“left” onclick="设置方向(-1,0)">◀</button><button class="right" onclick="设置方向(1,0)">▶</button><button class="down" onclick="设置方向(0,1)">▼</button></div><p>键盘方向键 / 点击按钮控制 | R 重新开始</p><script>const c=document.getElementById("game"),x=c.getContext("2d"),b=20,s=c.width/b;let sk,fd,dx,dy,sc,gl;function 设置方向(ndx,ndy){如果(dx===-ndx&&dy===-ndy)return;dx=ndx;dy=ndy}function 初始化(){sk=[{x:10,y:10}];dx=0;dy=0;sc=0;pf();如果(gl)clearInterval(gl);gl=setInterval(向上,120);dr()}function pf(){fd={x:Math.floor(Math.random()*s),y:Math.floor(Math.random()*s)}}function 向上(){如果(dx===0&&dy===0)返回;const h={x:sk[0].x+dx,y:sk[0].y+dy};如果(h.x<0||h.x>=s||h.y<0||h.y>=s||sk.some(t=>t.x===h.x&&t.y===h.y)){clearInterval(gl);x.fillStyle="rgba(0,0,0,0.7)";x.fillRect(0,0,c.宽度,c.高度);x.fillStyle="#e94560";x.font="28px 无衬线体";x.textAlign="居中";x.fillText("游戏结束!",c.宽度/2,c.高度/2-15);x.font="20px 无衬线体";x.fillText("得分: "+sc,c.宽度/2,c.高度/2+20);返回}sk.unshift(h);如果(h.x===fd.x&&h.y===fd.y){sc++;pf()}否则 sk.pop();dr()}function dr(){x.fillStyle="#16213e";x.fillRect(0,0,c.宽度,c.高度);x.fillStyle="#0f3460";sk.forEach(t=>x.fillRect(t.x*b,t.y*b,b-1,b-1));x.fillStyle="#e94560";x.fillRect(fd.x*b,fd.y*b,b-1,b-1);x.fillStyle="#fff";x.font="14px 无衬线体";x.textAlign=“左”;x.fillText("得分: "+sc,10,20)}document.addEventListener("keydown",e=>{如果(e.键===“向上箭头”)设置方向(0,-1);否则 如果(e.键==="向下箭头")设置方向(0,1);否则 如果(e.键==="向左箭头")设置方向(-1,0);否则 如果(e.键==="向右箭头")设置方向(1,0);否则 如果(e.键==="r"||e.键==="R")初始化()});初始化();</脚本></主体></HTML>
