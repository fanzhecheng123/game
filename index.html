<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>贪吃蛇大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:sans-serif;color:#fff;outline:none}
h1{font-size:28px;margin:20px 0 10px;background:linear-gradient(90deg,#00d2ff,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#info{display:flex;gap:20px;font-size:14px;color:#aaa;margin-bottom:8px}
#info b{color:#e94560}
#wrap{position:relative;border:2px solid #e94560;border-radius:12px;overflow:hidden}
canvas{display:block;background:#16213e}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#menu h2{color:#e94560;font-size:22px;margin-bottom:8px}
#menu button{width:200px;padding:10px;border:2px solid #333;border-radius:10px;background:transparent;color:#fff;font-size:14px;cursor:pointer}
#menu button:hover{border-color:#e94560;background:rgba(233,69,96,.1)}
#menu .d{font-size:11px;color:#666;margin-top:4px}
#pad{display:grid;grid-template-areas:". u ." "l . r" ". d .";gap:6px;margin:12px 0}
#pad button{width:56px;height:56px;font-size:22px;border:1px solid #333;border-radius:14px;background:#1a1a3e;color:#fff;cursor:pointer}
#pad button:active{background:#e94560}
.u{grid-area:u}.d{grid-area:d}.l{grid-area:l}.r{grid-area:r}
#help{color:#555;font-size:12px;margin-bottom:20px}
#dbg{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-size:13px;padding:4px 8px;font-family:monospace}
</style>
</head>
<body>
<h1>🐍 贪吃蛇大作战</h1>
<div id="info">
<div>得分: <b id="sc">0</b></div>
<div id="lvInfo" style="display:none">关卡: <b id="lv">1</b></div>
<div id="tmInfo" style="display:none">⏱ <b id="tm">60</b>s</div>
<div>最高: <b id="bs">0</b></div>
</div>
<div id="wrap">
<canvas id="cv" width="400" height="400"></canvas>
<div id="menu">
<h2>选择模式</h2>
<button onclick="go('classic')">🐍 经典模式<div class="d">撞墙或撞自己结束</div></button>
<button onclick="go('level')">🏆 闯关模式<div class="d">每关加速，有障碍物</div></button>
<button onclick="go('ai')">🤖 AI对战<div class="d">60秒和笨AI比分数</div></button>
</div>
</div>
<div id="pad">
<button class="u" onclick="sd(0,-1)">▲</button>
<button class="l" onclick="sd(-1,0)">◀</button>
<button class="r" onclick="sd(1,0)">▶</button>
<button class="d" onclick="sd(0,1)">▼</button>
</div>
<div id="help">WASD / 方向键 / 点按钮控制 | R 返回菜单</div>
<div id="dbg">调试: 页面加载完成</div>
<script>
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var BS=20,GS=20;
var snake,food,dirX,dirY,score,timer,mode,level,tgt,walls,aiSnake,aiDir,aiScore,over,sec,secTimer,aiTimer;
var best=parseInt(localStorage.getItem("snakeBest")||"0");
document.getElementById("bs").textContent=best;
var dbg=document.getElementById("dbg");

function dd(m){dbg.textContent="调试: "+m;}

dd("脚本开始执行");

function sd(nx,ny){
  dd("sd("+nx+","+ny+") 当前方向:"+dirX+","+dirY+" over:"+over);
  if(over){dd("游戏结束，忽略");return;}
  if(dirX==-nx&&dirY==-ny&&(dirX!=0||dirY!=0)){dd("反向，忽略");return;}
  dirX=nx;dirY=ny;
  dd("方向设置成功: "+dirX+","+dirY);
}

function go(m){
  dd("开始游戏: "+m);
  mode=m;level=1;score=0;over=false;
  snake=[{x:5,y:10}];dirX=0;dirY=0;walls=[];
  tgt=5;
  document.getElementById("sc").textContent="0";
  document.getElementById("lvInfo").style.display=m=="level"?"block":"none";
  document.getElementById("tmInfo").style.display=m=="ai"?"block":"none";
  document.getElementById("menu").style.display="none";
  if(m=="ai"){
    sec=60;document.getElementById("tm").textContent="60";
    aiSnake=[{x:15,y:10}];aiDir={x:0,y:0};aiScore=0;
    if(secTimer)clearInterval(secTimer);
    secTimer=setInterval(function(){
      sec--;document.getElementById("tm").textContent=sec;
      if(sec<=0){clearInterval(secTimer);clearInterval(timer);clearInterval(aiTimer);endGame();}
    },1000);
  }else{aiSnake=null;if(secTimer)clearInterval(secTimer);}
  if(m=="level")makeWalls();
  newFood();
  if(timer)clearInterval(timer);
  if(aiTimer)clearInterval(aiTimer);
  var sp=m=="level"?Math.max(55,125-level*8):110;
  timer=setInterval(step,sp);
  if(m=="ai")aiTimer=setInterval(aiStep,220);
  draw();
  dd("游戏已启动，等待按键...");
}

function makeWalls(){
  walls=[];var n=Math.min(level*2,14);
  for(var i=0;i<n;i++){
    var wx,wy,ok=false;
    for(var t=0;t<50;t++){
      wx=Math.floor(Math.random()*GS);wy=Math.floor(Math.random()*GS);
      if(wx>=3&&wx<=7&&wy>=8&&wy<=12)continue;
      if(wx>=13&&wx<=17&&wy>=8&&wy<=12)continue;
      var dup=false;
      for(var j=0;j<walls.length;j++){if(walls[j].x==wx&&walls[j].y==wy){dup=true;break;}}
      if(!dup){ok=true;break;}
    }
    if(ok)walls.push({x:wx,y:wy});
  }
}

function newFood(){
  for(var t=0;t<100;t++){
    food={x:Math.floor(Math.random()*GS),y:Math.floor(Math.random()*GS)};
    var bad=false;
    for(var i=0;i<snake.length;i++){if(snake[i].x==food.x&&snake[i].y==food.y){bad=true;break;}}
    if(bad)continue;
    if(aiSnake){for(var i=0;i<aiSnake.length;i++){if(aiSnake[i].x==food.x&&aiSnake[i].y==food.y){bad=true;break;}}}
    if(bad)continue;
    for(var i=0;i<walls.length;i++){if(walls[i].x==food.x&&walls[i].y==food.y){bad=true;break;}}
    if(bad)continue;
    return;
  }
  food={x:0,y:0};
}

function step(){
  if(over)return;
  if(dirX==0&&dirY==0)return;
  var h={x:snake[0].x+dirX,y:snake[0].y+dirY};
  if(h.x<0||h.x>=GS||h.y<0||h.y>=GS){endGame();return;}
  for(var i=0;i<snake.length;i++){if(snake[i].x==h.x&&snake[i].y==h.y){endGame();return;}}
  for(var i=0;i<walls.length;i++){if(walls[i].x==h.x&&walls[i].y==h.y){endGame();return;}}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){
    score++;document.getElementById("sc").textContent=score;newFood();
    if(mode=="level"&&score>=tgt*level){
      level++;document.getElementById("lv").textContent=level;tgt=5+level*2;
      makeWalls();clearInterval(timer);timer=setInterval(step,Math.max(55,125-level*8));
    }
  }else{snake.pop();}
  draw();
}

function aiStep(){
  if(!aiSnake||over)return;
  if(Math.random()<0.45)return;
  var h=aiSnake[0];
  var dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  dirs.sort(function(){return Math.random()-0.5;});
  var nx=0,ny=0,found=false;
  for(var i=0;i<dirs.length;i++){
    var dx=dirs[i][0],dy=dirs[i][1];
    if(aiDir.x==-dx&&aiDir.y==-dy)continue;
    var tx=h.x+dx,ty=h.y+dy;
    if(tx<0||tx>=GS||ty<0||ty>=GS)continue;
    var bad=false;
    for(var j=0;j<aiSnake.length;j++){if(aiSnake[j].x==tx&&aiSnake[j].y==ty){bad=true;break;}}
    if(bad)continue;
    for(var j=0;j<snake.length;j++){if(snake[j].x==tx&&snake[j].y==ty){bad=true;break;}}
    if(bad)continue;
    for(var j=0;j<walls.length;j++){if(walls[j].x==tx&&walls[j].y==ty){bad=true;break;}}
    if(bad)continue;
    nx=dx;ny=dy;found=true;break;
  }
  if(!found)return;
  aiDir={x:nx,y:ny};
  var nh={x:h.x+nx,y:h.y+ny};
  aiSnake.unshift(nh);
  if(nh.x==food.x&&nh.y==food.y){aiScore++;newFood();}
  else{aiSnake.pop();}
}

function endGame(){
  over=true;clearInterval(timer);
  if(secTimer)clearInterval(secTimer);
  if(aiTimer)clearInterval(aiTimer);
  if(score>best){best=score;localStorage.setItem("snakeBest",best);document.getElementById("bs").textContent=best;}
  var msg="游戏结束!";
  if(mode=="ai")msg=score>aiScore?"🎉 你赢了! "+score+" vs "+aiScore:score==aiScore?"🤝 平局! "+score+" vs "+aiScore:"🤖 AI赢了! "+aiScore+" vs "+score;
  ctx.fillStyle="rgba(0,0,0,.85)";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#e94560";ctx.font="26px sans-serif";ctx.textAlign="center";
  ctx.fillText(msg,cv.width/2,cv.height/2-20);
  ctx.fillStyle="#fff";ctx.font="18px sans-serif";
  ctx.fillText("得分: "+score,cv.width/2,cv.height/2+15);
  ctx.fillStyle="#aaa";ctx.font="14px sans-serif";
  ctx.fillText("点击画布返回菜单",cv.width/2,cv.height/2+50);
  cv.onclick=function(){cv.onclick=null;showMenu();};
}

function showMenu(){
  clearInterval(timer);if(secTimer)clearInterval(secTimer);if(aiTimer)clearInterval(aiTimer);
  document.getElementById("menu").style.display="flex";
  ctx.fillStyle="#16213e";ctx.fillRect(0,0,cv.width,cv.height);
}

函数 draw(){
  ctx.fillStyle="#16213e";ctx.fillRect(0,0,cv.width,cv.height);
对于(变量 i=0;i<GS;i++(变量 j=0;j<GS;j++)如果((i+j)%2==0){上下文.fillStyle="rgba(255,255,255,.02)";上下文.fillRect(i*BS,j*BS,BS,BS);}
  ( i=0;i<walls.长度;i++){上下文.填充样式="#444";上下文.填充矩形(walls[i].x*BS,walls[i].y*BS,BS,BS);}
对于i=0;i<蛇.长度;i++{上下文.填充样式=i==0?“#00d2ff”:“#0f3460”;上下文.fillRect(蛇[i].x*BS+1,蛇[
  (aiSnake){for(var i=0;i<aiSnake.length;i++){ctx.fillStyle=i==0?"#ffd700":"#b8860b";ctx.fillRect(aiSnake[i].x*BS+1,aiSnake[i].y*BS+1,BS-2,BS-2);}}
  ctx.fillStyle="#e94560";ctx.beginPath();ctx.arc(food.x*BS+BS/2,food.y*BS+BS/2,BS/2-2,0,Math.PI*2);ctx.fill();
  如果(模式=="ai"){上下文.填充颜色="#00d2ff";上下文.字体="13px 无衬线体";上下文.文本对齐="左对齐";上下文.绘制文本("你:"+分数,10,20);上下文.填充颜色="#ffd700";上下文.绘制文本("AI:"+人工智能分数,10,38);}
}

文档.onkeydown=函数(e){
  var k=e.key||"";
  var kc=e.keyCode||0;
  dd("按键: ["+k+"] code="+kc);
  k=k.toLowerCase();
  如果(k=="w"||k=="arrowup"||kc==38){e.preventDefault();sd(0,-1);}
  否则 如果(k=="s"||k=="向下箭头"||kc==40){e.preventDefault();sd(0,1);}
  否则 如果(k=="a"||k=="arrowleft"||kc==37){e.preventDefault();sd(-1,0);}
  否则 如果(k=="d"||k=="arrowright"||kc==39){e.preventDefault();sd(1,0);}
  else if(k=="r"){showMenu();}
};

dd("所有代码执行完毕，等待操作");
showMenu();
</script>
</body>
</html>
