<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>贪吃蛇</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff}h1{margin-bottom:10px}canvas{border:2px solid #e94560;border-radius:8px;background:#16213e}p{margin-top:10px;color:#aaa}</style>
</head><body><h1>🐍 贪吃蛇</h1><canvas id="game" width="400" height="400"></canvas><p>方向键控制 | R 重新开始</p>
<script>const c=document.getElementById("game"),x=c.getContext("2d"),b=20,s=c.width/b;let sk,fd,dx,dy,sc,gl;
function init(){sk=[{x:10,y:10}];dx=0;dy=0;sc=0;pf();if(gl)clearInterval(gl);gl=setInterval(up,100)}
function pf(){fd={x:Math.floor(Math.random()*s),y:Math.floor(Math.random()*s)}}
function up(){if(dx===0&&dy===0)return;const h={x:sk[0].x+dx,y:sk[0].y+dy};if(h.x<0||h.x>=s||h.y<0||h.y>=s||sk.some(t=>t.x===h.x&&t.y===h.y)){clearInterval(gl);x.fillStyle="rgba(0,0,0,0.6)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#e94560";x.font="30px sans-serif";x.textAlign="center";x.fillText("游戏结束! 得分: "+sc,c.width/2,c.height/2);return}sk.unshift(h);if(h.x===fd.x&&h.y===fd.y){sc++;pf()}else sk.pop();dr()}
function dr(){x.fillStyle="#16213e";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0f3460";sk.forEach(t=>x.fillRect(t.x*b,t.y*b,b-1,b-1));x.fillStyle="#e94560";x.fillRect(fd.x*b,fd.y*b,b-1,b-1);x.fillStyle="#fff";x.font="14px sans-serif";x.textAlign="left";x.fillText("得分: "+sc,10,20)}
document.addEventListener("keydown",e=>{if(e.key==="ArrowUp"&&dy!==1){dx=0;dy=-1}else if(e.key==="ArrowDown"&&dy!==-1){dx=0;dy=1}else if(e.key==="ArrowLeft"&&dx!==1){dx=-1;dy=0}else if(e.key==="ArrowRight"&&dx!==-1){dx=1;dy=0}else if(e.key==="r"||e.key==="R")init()});
init();</script></body></html>
